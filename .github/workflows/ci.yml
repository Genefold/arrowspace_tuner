name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (no arrowspace — lint only)
        run: uv sync --extra dev --no-install-project

      - name: Lint (ruff)
        run: uv run ruff check src

      - name: Type check (mypy)
        run: uv run mypy src

  test:
    name: pytest (py${{ matrix.python-version }}, arrowspace ${{ matrix.arrowspace-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # Lower bound, the release that introduced strict builder-key
        # validation, and the upper tested version of the declared support
        # range (arrowspace >= 0.26.0, < 0.29).
        arrowspace-version: ["0.26.0", "0.27.3", "0.28.1"]

    steps:
      - uses: actions/checkout@v4

      # arrowspace publishes wheels only for macOS arm64 — on ubuntu uv
      # builds the sdist, which needs a Rust toolchain (maturin).
      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Lockfile bypass: uv sync cannot override a locked direct
      # dependency, so each cell builds its own venv. The arrowspace pin
      # goes in first; the project is installed with --no-deps and its
      # remaining dependencies explicitly, so nothing can replace the pin.
      - name: Create isolated compatibility environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          . .venv-ci/bin/activate
          uv pip install "arrowspace==${{ matrix.arrowspace-version }}"
          uv pip install --no-deps .
          uv pip install "numpy>=2.4.4" "optuna>=4.8.0" "scipy>=1.17.1" "mcp>=1.0.0" "pytest>=8.0" "pytest-cov>=5.0"

      - name: Verify resolved ArrowSpace version
        run: |
          . .venv-ci/bin/activate
          python - <<'PY'
          import importlib.metadata as md
          expected = "${{ matrix.arrowspace-version }}"
          actual = md.version("arrowspace")
          print(f"Expected arrowspace: {expected}")
          print(f"Actual arrowspace:   {actual}")
          assert actual == expected, (actual, expected)
          PY

      - name: Environment diagnostics
        run: |
          . .venv-ci/bin/activate
          python --version
          rustc --version
          cargo --version
          uv pip show arrowspace | grep -E "^(Name|Version)"
          uv pip show arrowspace_tuner | grep -E "^(Name|Version)"

      - name: Run full compatibility suite
        run: |
          . .venv-ci/bin/activate
          python -m pytest -v

  wheel-smoke:
    name: wheel smoke (py3.13, arrowspace 0.28.1)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # the arrowspace==0.28.1 dependency is built from sdist on ubuntu
      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build wheel
        run: uv build

      - name: Install built artefact in a clean environment
        run: |
          uv venv --python 3.13 .venv-wheel
          . .venv-wheel/bin/activate
          uv pip install "arrowspace==0.28.1"
          uv pip install --no-deps dist/arrowspace_tuner-*.whl
          uv pip install "numpy>=2.4.4" "optuna>=4.8.0" "scipy>=1.17.1" "click>=8.1"

      - name: Verify installed distribution
        run: |
          . .venv-wheel/bin/activate
          python -c "import importlib.metadata as md; assert md.version('arrowspace') == '0.28.1'; print('arrowspace_tuner', md.version('arrowspace_tuner'))"

      # Run from /tmp so sys.path cannot shadow the installed wheel with
      # the source checkout.
      - name: Run quickstart and power-user examples
        run: |
          . .venv-wheel/bin/activate
          cd /tmp
          python "$GITHUB_WORKSPACE/examples/quickstart.py"
          python "$GITHUB_WORKSPACE/examples/power_user.py"

      - name: Smoke-test the installed CLI
        run: |
          . .venv-wheel/bin/activate
          cd /tmp
          arrowspace-tuner version --format json
          arrowspace-tuner validate "$GITHUB_WORKSPACE/tests/fixtures/embeddings.npy" --format json
          arrowspace-tuner tune "$GITHUB_WORKSPACE/tests/fixtures/embeddings.npy" \
            --trials 3 \
            --format json

      # --save-report without --report-dir must fail predictably (exit 3),
      # and an unwritable --output target must fail with exit 5.
      - name: Smoke-test CLI failure contracts
        run: |
          . .venv-wheel/bin/activate
          cd /tmp
          set +e
          out=$(arrowspace-tuner tune "$GITHUB_WORKSPACE/tests/fixtures/embeddings.npy" \
            --trials 3 --save-report --format json)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 3 ] || { echo "expected exit 3, got $code"; exit 1; }
          echo "$out" | grep -q "missing_report_dir"

          mkdir -p /tmp/output-target
          set +e
          out=$(arrowspace-tuner tune "$GITHUB_WORKSPACE/tests/fixtures/embeddings.npy" \
            --trials 3 --format json --output /tmp/output-target)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 5 ] || { echo "expected exit 5, got $code"; exit 1; }
          echo "$out" | grep -q "output_write_failed"

      - name: Smoke-test the installed MCP entry point
        run: |
          . .venv-wheel/bin/activate
          cd /tmp
          uv pip install "mcp>=1.0.0"
          ARROWSPACE_TUNER_ALLOWED_ROOTS="$GITHUB_WORKSPACE/tests/fixtures" \
            arrowspace-tuner mcp --help

      # Invalid limits are server configuration errors: the server must
      # refuse to start with a message naming the offending variable.
      - name: Smoke-test MCP limit validation
        run: |
          . .venv-wheel/bin/activate
          cd /tmp
          set +e
          out=$(ARROWSPACE_TUNER_ALLOWED_ROOTS="$GITHUB_WORKSPACE/tests/fixtures" \
            ARROWSPACE_TUNER_MAX_TRIALS=0 arrowspace-tuner mcp 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "expected non-zero exit"; exit 1; }
          echo "$out" | grep -q "ARROWSPACE_TUNER_MAX_TRIALS must be a positive integer"
