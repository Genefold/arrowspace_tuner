name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (no arrowspace — lint only)
        run: uv sync --extra dev --no-install-project

      - name: Lint (ruff)
        run: uv run ruff check src

      - name: Type check (mypy)
        run: uv run mypy src

  test:
    name: pytest (py${{ matrix.python-version }}, arrowspace ${{ matrix.arrowspace-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # Floor and ceiling of the declared support range
        # (arrowspace >= 0.26.0, < 0.29). Isolated resolution via --with,
        # so the local lockfile cannot conceal an unsupported resolution.
        arrowspace-version: ["0.26.0", "0.28.1"]

    steps:
      - uses: actions/checkout@v4

      # arrowspace publishes wheels only for macOS arm64 — on ubuntu uv
      # builds the sdist, which needs a Rust toolchain (maturin).
      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps with arrowspace ${{ matrix.arrowspace-version }}
        run: uv sync --extra dev --python ${{ matrix.python-version }} --with "arrowspace==${{ matrix.arrowspace-version }}"

      - name: Run tests
        run: uv run --no-sync pytest -v --cov=arrowspace_tuner --cov-report=term-missing
